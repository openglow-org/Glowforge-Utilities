name: Host tests

# The protocol, the dispatch, the pulse header and the lifecycle run
# against fakes on every push.
on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Install
        run: |
          python -m pip install --upgrade pip pytest
          python -m pip install -e .
      - name: Test
        run: python -m pytest -q tests
