name: Host tests

# The protocol, the dispatch, the pulse header and the lifecycle run
# against fakes on every push, on the newest Python and on 3.12, the
# image's. The cloud client's suite (python3-gfhardware, this library's
# main consumer) runs against this checkout too. Every action is pinned by
# commit.
on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  pytest:
    runs-on: ubuntu-latest
    # The suite takes seconds; a case left hanging fails here, not at the
    # six-hour default.
    timeout-minutes: 5
    strategy:
      matrix:
        python-version: ['3.x', '3.12']
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        # On 3.12, the image's interpreter, at the versions the image ships.
        run: |
          python -m pip install --upgrade pip pytest
          python -m pip install -e . ${{ matrix.python-version == '3.12' && '-c .github/image-constraints.txt' || '' }}
      - name: Test
        run: python -m pytest -q tests

  gfhardware:
    # python3-gfhardware's suite on this checkout: on next, its next; else
    # its default branch.
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          path: Glowforge-Utilities
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          repository: openglow-org/python3-gfhardware
          ref: ${{ (github.ref_name == 'next' || github.base_ref == 'next') && 'next' || '' }}
          path: python3-gfhardware
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Install the service library's dependencies
        run: >-
          python -m pip install --upgrade pip requests urllib3 websocket-client
          -c Glowforge-Utilities/.github/image-constraints.txt
      - name: Run every test module in its own interpreter
        working-directory: python3-gfhardware
        run: |
          set -e
          for t in tests/test_*.py; do
            m=$(basename "$t" .py)
            echo "== $m"
            python -m unittest -v "tests.$m"
          done
