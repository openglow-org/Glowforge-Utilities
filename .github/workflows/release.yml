name: Release

# Build and publish the package to PyPI and GitHub Releases when a version
# tag (e.g. `v0.8.5` or `0.8.5`) is pushed on a commit of the release branch,
# master. A tag on any other commit publishes nothing. The host tests must
# pass before the build. Every action is pinned by commit.
on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+*'   # v0.8.5, v0.8.5rc1, v1.2.3-post1, ...
      - '[0-9]+.[0-9]+.[0-9]+*'    # 0.8.5, ...

# Least privilege by default; jobs elevate only what they need.
permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release-branch:
    name: The tag is on master
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0

      - name: Refuse a tag whose commit is not on master
        run: |
          git fetch --no-tags origin master
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/master; then
            echo "::error::The tag ${GITHUB_REF_NAME} names ${GITHUB_SHA}, which is not on master."
            exit 1
          fi

  host-tests:
    name: Host tests
    needs: release-branch
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'

      - name: Test
        run: |
          python -m pip install --upgrade pip pytest
          python -m pip install -e . -c .github/image-constraints.txt
          python -m pytest -q tests

  build:
    name: Build & verify distributions
    needs: host-tests
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'

      - name: Build sdist and wheel
        run: |
          python -m pip install --upgrade pip build twine
          python -m build
          twine check dist/*

      - name: Verify the git tag matches the built package version
        run: |
          tag="${GITHUB_REF_NAME#v}"
          built="$(ls dist/*.whl | head -n1 | xargs -n1 basename | cut -d- -f2)"
          echo "git tag = ${tag}    built version = ${built}"
          if [ "${tag}" != "${built}" ]; then
            echo "::error::Git tag (${tag}) does not match the built package version (${built}). Update setup.py or the tag."
            exit 1
          fi

      - name: Upload distributions
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  pypi-publish:
    name: Publish to PyPI
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Must match the GitHub environment configured in the PyPI trusted publisher.
    environment:
      name: pypi
      url: https://pypi.org/project/gfutilities/
    permissions:
      id-token: write          # OIDC token for PyPI Trusted Publishing
    steps:
      - name: Download distributions
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: dist
          path: dist/

      - name: Publish to PyPI (Trusted Publishing / OIDC)
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3

  github-release:
    name: Publish GitHub Release
    needs: pypi-publish
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write          # create the release and upload assets
    steps:
      - name: Download distributions
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: dist
          path: dist/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          files: dist/*
          generate_release_notes: true
          fail_on_unmatched_files: true
